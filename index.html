<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eeeae2">
  <meta name="description" content="Lindsey Bemmels — Lead Designer. Something new is in the works.">
  <title>Lindsey Bemmels — Lead Designer</title>
  <style>
    :root { --paper:#eeeae2; --ink:#282827; --blue:#3b49a0; }
    * { box-sizing:border-box; }
    html { min-height:100%; }
    body { margin:0; min-height:100svh; background:var(--paper); color:var(--ink); font-family:Arial,Helvetica,sans-serif; -webkit-font-smoothing:antialiased; }
    .page { min-height:100svh; max-width:1600px; margin:auto; padding:clamp(25px,4.4vw,76px); display:flex; flex-direction:column; justify-content:space-between; gap:72px; }
    .top,.bottom { display:flex; justify-content:space-between; align-items:center; gap:20px; }
    .eyebrow,.micro { font-size:clamp(10px,.85vw,12px); font-weight:700; letter-spacing:.12em; text-transform:uppercase; }
    .mark { width:23px; height:23px; border:2px solid var(--blue); border-radius:50%; position:relative; flex-shrink:0; }
    .mark::after { content:""; width:7px; height:7px; background:var(--blue); border-radius:50%; position:absolute; inset:6px; }
    main { padding:4vh 0 7vh; }
    .hello { color:var(--blue); margin:0 0:20px; }
    h1 { font-size:clamp(76px,13.5vw,220px); letter-spacing:-.085em; line-height:.85; font-weight:700; margin:0 0 35px -.075em; }
    h1 span { display:block; }
    .role { font-size:clamp(18px,2.15vw,30px); letter-spacing:-.035em; margin:0; }
    footer { border-top:1px solid var(--blue); padding-top:23px; }
    .message { font-size:clamp(16px,1.55vw,22px); margin:0 0 50px; }
    .bottom { align-items:flex-end; }
    .micro { color:var(--blue); margin:0; }
    a { color:var(--blue); font-size:clamp(14px,1.2vw,17px); font-weight:700; text-underline-offset:5px; transition:opacity .2s,transform .2s; display:inline-block; }
    a:hover { opacity:.7; transform:translate(3px,-3px); }
    a:focus-visible { outline:2px solid var(--blue); outline-offset:6px; }
    @media(max-width:600px) { .page { gap:45px; padding:26px 24px 30px; } main { padding:5vh 0; } h1 { font-size:clamp(62px,16vw,100px); margin-bottom:25px; } .message { margin-bottom:35px; } }
    @media(prefers-reduced-motion:reduce) { a { transition:none; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="top">
      <span class="eyebrow">Design / In Transition</span>
      <span class="mark" aria-hidden="true"></span>
    </header>
    <main>
      <p class="eyebrow hello">Hello, I'm</p>
      <h1><span>Lindsey</span><span>Bemmels.</span></h1>
      <p class="role">Lead Designer</p>
    </main>
    <footer>
      <p class="message">Something new is in the works.</p>
      <div class="bottom">
        <p class="micro">Stay curious</p>
        <a href="https://www.linkedin.com/in/lindseybemmels/" target="_blank" rel="noopener noreferrer" aria-label="Visit Lindsey Bemmels on LinkedIn (opens in a new tab)">LinkedIn ↗</a>
      </div>
    </footer>
  </div>
</body>
</html>
